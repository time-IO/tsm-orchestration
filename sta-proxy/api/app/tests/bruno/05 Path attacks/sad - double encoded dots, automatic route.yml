info:
  name: sad - double encoded dots, automatic route
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/sta/{{endpointGroup1}}/%252e%252e/{{endpointGroup2}}/v1.1"
  headers:
