info:
  name: member - Datastreams page
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/sta/internal/{{endpointGroup1}}/v1.1/Datastreams?$top=2"
  headers:
    - name: X-Test-User
      value: user1

runtime:
  scripts:
    - type: tests
      code: |-
        test("nextLink stays on the requested route", function () {
          const link = res.getBody()["@iot.nextLink"];
          expect(link).to.be.a("string");
          expect(link).to.include("/sta/internal/" + bru.interpolate("{{endpointGroup1}}") + "/v1.1/Datastreams");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
