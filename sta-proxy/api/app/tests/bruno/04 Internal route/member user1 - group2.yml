info:
  name: member user1 - group2
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/sta/internal/{{endpointGroup2}}/v1.1"
  headers:
    - name: X-Test-User
      value: user1

runtime:
  scripts:
    - type: tests
      code: |-
        test("served from internal FROST, not cacheable", function () {
          expect(res.getHeader("cache-control")).to.equal("private, no-store");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
