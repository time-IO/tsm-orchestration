info:
  name: search q=group1
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/sta-proxy/api/endpoints?q=group1"

runtime:
  scripts:
    - type: tests
      code: |-
        test("only group1", function () {
          expect(res.getBody().endpoints.map((e) => e.name)).to.deep.equal([bru.interpolate("{{endpointGroup1}}")]);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
