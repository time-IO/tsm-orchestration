info:
  name: user2 - group1 internal
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/sta-proxy/api/endpoints"
  headers:
    - name: X-Test-User
      value: user2

runtime:
  scripts:
    - type: tests
      code: |-
        test("is_internal per endpoint", function () {
          const internal = Object.fromEntries(res.getBody().endpoints.map((e) => [e.name, e.is_internal]));
          expect(internal[bru.interpolate("{{endpointGroup1}}")]).to.equal(true);
          expect(internal[bru.interpolate("{{endpointGroup2}}")]).to.equal(false);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
