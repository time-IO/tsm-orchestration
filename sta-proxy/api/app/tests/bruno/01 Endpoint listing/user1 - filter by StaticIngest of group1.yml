info:
  name: user1 - filter by StaticIngest of group1
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/sta-proxy/api/endpoints?ingest_id={{ingestStaticGroup1}}"
  headers:
    - name: X-Test-User
      value: user1

runtime:
  scripts:
    - type: tests
      code: |-
        test("only the endpoint of the ingest's group", function () {
          expect(res.getBody().endpoints.map((e) => e.name)).to.deep.equal([bru.interpolate("{{endpointGroup1}}")]);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
