info:
  name: Resolve endpoint names
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/sta-proxy/api/endpoints"
  headers:
    - name: X-Test-User
      value: user1

runtime:
  scripts:
    - type: tests
      code: |-
        const endpoints = res.getBody().endpoints;
        for (const [project, variable] of [["group1", "endpointGroup1"], ["group2", "endpointGroup2"]]) {
          const endpoint = endpoints.find((e) => e.group === "vo" && e.project === project);
          test(`endpoint of VO:${project} exists`, function () {
            expect(endpoint).to.not.be.undefined;
          });
          if (endpoint) bru.setVar(variable, endpoint.name);
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
