info:
  name: sad - set session foreign origin
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/sta/session"
  headers:
    - name: X-Test-User
      value: user2
    - name: Origin
      value: https://evil.example

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
