## HTTP - INPUT
## Allows Bento to save stream-configs - in case of restart, ...

# All config fields, showing default values
input:
  http_server:
    address: "0.0.0.0:4200"
    path: /streams/
    # expects somthing like /streams/{ingest-type}/{thing-uuid}
    ws_path: /streams/ws
    ws_welcome_message: ""
    ws_rate_limit_message: ""
    allowed_verbs:
      - POST
      - PUT
      - DELETE
    timeout: 5s
    rate_limit: ""
    cert_file: ""
    key_file: ""
    cors:
      enabled: false
      allowed_origins: []
    sync_response:
      status: "200"
      headers:
        Content-Type: application/octet-stream
      metadata_headers:
        include_prefixes: []
        include_patterns: []

buffer:
  type: none

pipeline:
  processors:
    - mapping: |
        root = content()
        let verb = metadata("http_server_request_method")   # POST / DELETE
        let req_path = metadata("http_server_request_path") # /streams/...
        meta verb = $verb
        meta req_path = $req_path
        # same path you used to persist
        meta file_path = "/data/streams" + $req_path + ".json"

    - switch:
        - check: 'meta("verb") == "DELETE"'
          processors:
            - file:
                operation: delete
                path: '${! meta("file_path") }'
            - mapping: 'root = deleted()' # drop the message, nothing to forward
        - check: ""
          processors:
            # replace your file output with a file processor write
            - file:
                operation: write
                path: '${! meta("file_path") }'

    - mapping: |
        root = content()
        # Bento's own dynamic-streams API only takes a single-segment stream
        # ID (/streams/{id}), so strip the leading /streams/{ingest-type}/
        # segment before forwarding, e.g. /streams/external_mqtt/{uuid} ->
        # /streams/{uuid}.
        meta path_for_api = metadata("http_server_request_path").re_replace_all("^/streams/[^/]+/", "/streams/")

output:
  broker:
    pattern: fan_out
    outputs:
    - http_client:
        url: 'http://localhost:4195${! metadata("path_for_api") }'
        # Forward the original verb: Bento's real API rejects POST on an
        # existing stream (400 Stream already exists), so updates (PUT) must
        # stay PUT.
        verb: '${! meta("verb") }'
        headers: {}
        rate_limit: "" # No default (optional)
        timeout: 5s
        max_in_flight: 64
        batching:
          count: 0
          byte_size: 0
          period: ""
          jitter: 0
          check: ""
#    - file:
#        path: '${! metadata("http_server_request_path") }.json'
#        codec: all-bytes