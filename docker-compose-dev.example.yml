---
services:

  worker-thing-setup:
    volumes:
      - ./src:/home/appuser/app/src

  worker-file-ingest:
    volumes:
      - ./src:/home/appuser/app/src

  worker-run-qaqc:
    volumes:
      - ./src:/home/appuser/app/src

  worker-mqtt-ingest:
    volumes:
      - ./src:/home/appuser/app/src

  worker-grafana-user-orgs:
    volumes:
      - ./src:/home/appuser/app/src

  worker-sync-extsftp:
    volumes:
      - ./src:/home/appuser/app/src

  worker-sync-extapis:
    volumes:
      - ./src:/home/appuser/app/src

  worker-sync-sms:
    volumes:
      - ./src:/home/appuser/app/src

  visualization:
    environment:
      - "GF_AUTH_GENERIC_OAUTH_SCOPES=openid email profile eduperson_principal_name"
      - "GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${THING_MANAGEMENT_DJANGO_HELMHOLTZ_CLIENT_ID:-timeIO-client}"
      - "GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${THING_MANAGEMENT_DJANGO_HELMHOLTZ_CLIENT_SECRET:-pUolEnz1Ve5djx9oUpw1KBgB0YgIlUOQ}"
      - "GF_AUTH_GENERIC_OAUTH_AUTH_URL=${VISUALIZATION_GENERIC_OAUTH_AUTH_URL:-http://localhost/keycloak/realms/demo/protocol/openid-connect/auth}"
      - "GF_AUTH_GENERIC_OAUTH_TOKEN_URL=${VISUALIZATION_GENERIC_OAUTH_TOKEN_URL:-http://keycloak:8081/keycloak/realms/demo/protocol/openid-connect/token}"
      - "GF_AUTH_GENERIC_OAUTH_API_URL=${VISUALIZATION_GENERIC_OAUTH_API_URL:-http://keycloak:8081/keycloak/realms/demo/protocol/openid-connect/userinfo}"

  keycloak:
    environment:
      KC_LOG_LEVEL: "com.timeio.mqtt:DEBUG,org.keycloak:INFO"
    ports:
      - "${KEYCLOAK_PORT}:${KEYCLOAK_PORT}"
    volumes:
      - "./keycloak/keycloak-init-dev.template.json:/opt/keycloak/data/import/keycloak-init.json"

  dsm-api:
    image: timeio-dsm-api-local:dev
    build:
      context: .
      dockerfile: ./data-source-management/api/docker/Dockerfile-Dev
    working_dir: /app
    volumes:
      - ./data-source-management/api/app:/app:rw
      - ./src/timeio:/app/timeio:rw

  dsm-api-test-db:
    profiles:
      - test
    image: "postgres:14-alpine"
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: db_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - dsm-api-data-test:/var/lib/postgresql/data/
    depends_on:
      mqtt-broker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  dsm-frontend:
#    image: timeio-dsm-frontend-local:dev
    build:
      context: ./data-source-management/frontend
      dockerfile: docker/Dockerfile-Dev
    user: "node"
    working_dir: /home/node/app
    volumes:
      - ./data-source-management/frontend/app:/home/node/app:rw,cached
    environment:
      API_BASE_URL: "${DSM_API_APP_URL:-http://localhost/data-source-management/api}"
      OIDC_CLIENT_ID: "${DSM_FRONTEND_OIDC_CLIENT_ID:-timeIO-client}"
      OIDC_IDP_URL: "${DSM_FRONTEND_OIDC_IDP_URL:-http://localhost/keycloak/realms/timeio}" #url to idp without .well-known
      OIDC_REDIRECT_URI: "${DSM_FRONTEND_OIDC_REDIRECT_URI:-http://localhost/data-source-management/login-callback}"
      OIDC_SCOPE: "${DSM_FRONTEND_OIDC_SCOPE:-openid profile eduperson_principal_name eduperson_entitlement eduperson_unique_id email offline_access}"
      OIDC_POST_LOGOUT_REDIRECT_URI: "${DSM_FRONTEND_APP_URL:-http://localhost/data-source-management}"
      BASE_URL: "${DSM_FRONTEND_RELATIVE_PATH:-/data-source-management/}"
    command: "quasar dev"

  timeio-db-api:
    ports:
      - "127.0.0.1:8001:8001"

  proxy:
    volumes:
      - ./nginx/tsm.dev.conf:/etc/nginx/conf.d/default.conf:ro

  dozzle:
    image: amir20/dozzle:latest
    environment:
      DOZZLE_BASE: /dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  keycloak-data:
  npm:
  dsm-api-data-test:

