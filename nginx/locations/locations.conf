location = /frontend {
    return 308 /data-source-management/?;
}

location ^~ /frontend/ {
    return 308 /data-source-management/?;
}

# Live ingest streams (e.g. the MQTT client) are WebSockets and need the
# connection upgraded. This matches /data-source-management/api/ingest/<type>/<id>/live
# for any ingest type, so the upgrade headers stay scoped to the routes that
# actually need them instead of every /api request. The rewrite strips the
# /data-source-management/api prefix (a regex location can't do that via a
# trailing-slash proxy_pass). Regex locations take precedence over the prefix
# match below.
location ~ ^/data-source-management/api/ingest/[^/]+/[0-9]+/live$ {
    rewrite ^/data-source-management/api/(.*)$ /$1 break;
    proxy_pass http://dsm-api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}

location /data-source-management/api/ {
    proxy_pass http://dsm-api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /data-source-management/ {
    proxy_pass http://dsm-frontend:80/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Visualization with grafana

location /visualization/ {
    proxy_set_header Host $http_host;
    proxy_pass http://visualization.:3000;
}

# Proxy Grafana Live WebSocket connections.
location /visualization/api/live/ {
    rewrite  ^/visualization/(.*)  /$1 break;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_pass http://visualization.:3000/api/live/;
}

# Object storage with minio
location /object-storage/ {
    proxy_pass http://object-storage.:9001;
    rewrite   ^/object-storage/(.*) /$1 break;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # To support websocket
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

location /tsmdl/ {
    proxy_pass http://tsmdl.:8001/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
}

location /sta/ {
    proxy_pass http://frost.:8080/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Access-Control-Allow-Origin *;
    proxy_redirect off;
    proxy_read_timeout 120s;
}

location /keycloak/ {

    proxy_pass http://keycloak.:8081/keycloak/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_http_version 1.1;
    proxy_redirect off;
}
