{{- if .Values.enabled }}
{{- if .Values.global.pvc.createPVC }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.name }}-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- if .Values.global.pvc.storageClassName }}
  storageClassName: {{ .Values.global.pvc.storageClassName }}
  {{- end }}
{{- end }}
{{- end }}
