{{- if .Values.global.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-secret
type: Opaque
stringData:
  DB_URL: "postgresql://{{-  .Values.global.secrets.CREATEDB_POSTGRES_USER -}}:{{-  .Values.global.secrets.CREATEDB_POSTGRES_PASSWORD -}}@{{-  .Values.global.envvars.CREATEDB_POSTGRES_HOST -}}/{{-  .Values.global.envvars.CREATEDB_POSTGRES_DATABASE -}}"
  DB_API_AUTH_TOKEN_ADMIN: "{{ .Values.global.secrets.DB_API_AUTH_TOKEN_ADMIN }}"
  DB_API_AUTH_TOKEN_INGEST: "{{ .Values.global.secrets.DB_API_AUTH_TOKEN_INGEST }}"
  DB_API_AUTH_TOKEN_PROCESSING: "{{ .Values.global.secrets.DB_API_AUTH_TOKEN_PROCESSING }}"
{{- end }}