info:
  name: public - no Observations of internal device
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/sta/public/{{endpointGroup1}}/v1.1/Observations?$filter=Datastream/Sensor/name eq 'CS215'&$select=id&$top=1&$count=true"

runtime:
  scripts:
    - type: tests
      code: |-
        test("internal device CS215 is hidden", function () {
          expect(res.getBody()["@iot.count"]).to.equal(0);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
