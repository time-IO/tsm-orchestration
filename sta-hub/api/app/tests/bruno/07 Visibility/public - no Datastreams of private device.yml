info:
  name: public - no Datastreams of private device
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/sta/public/{{endpointGroup1}}/v1.1/Datastreams?$filter=Sensor/name eq 'CR1000X_Logger'&$select=id&$top=1&$count=true"

runtime:
  scripts:
    - type: tests
      code: |-
        test("private device CR1000X_Logger is hidden", function () {
          expect(res.getBody()["@iot.count"]).to.equal(0);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
