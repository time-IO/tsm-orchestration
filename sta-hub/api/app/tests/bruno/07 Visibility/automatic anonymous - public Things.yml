info:
  name: automatic anonymous - public Things
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/sta/{{endpointGroup1}}/v1.1/Things?$select=name&$orderby=name"

runtime:
  scripts:
    - type: tests
      code: |-
        test("public data", function () {
          expect(res.getBody().value.map((e) => e.name)).to.deep.equal(["CRNS - Static", "Rover - separate GPS"]);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
