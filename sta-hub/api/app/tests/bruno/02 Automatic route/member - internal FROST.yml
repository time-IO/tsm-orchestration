info:
  name: member - internal FROST
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/sta/{{endpointGroup1}}/v1.1"
  headers:
    - name: X-Test-User
      value: user2

runtime:
  scripts:
    - type: tests
      code: |-
        test("served from internal FROST, not cacheable", function () {
          expect(res.getHeader("cache-control")).to.equal("private, no-store");
        });

        test("varies by authorization", function () {
          expect(res.getHeader("vary")).to.include("Authorization");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
