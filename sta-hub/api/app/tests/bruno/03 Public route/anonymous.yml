info:
  name: anonymous
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/sta/public/{{endpointGroup1}}/v1.1"

runtime:
  scripts:
    - type: tests
      code: |-
        test("public FROST, cacheable, not varying by user", function () {
          expect(res.getHeader("cache-control")).to.be.undefined;
          expect(res.getHeader("vary")).to.be.undefined;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
