---
combined-e2e-test:
  image: "docker:${DOCKER_IMAGE_TAG}"
  stage: "end-to-end"
  needs:
    - "build-and-push-images"
  before_script:
      # Log in to the container registry so docker compose can pull branch-specific images
      - "export REGISTRY=$(grep TIMEIO_IMAGE_REGISTRY .env | cut -d'=' -f2)"
      - "echo $CI_REGISTRY_PASSWORD | docker login $REGISTRY -u $CI_REGISTRY_USER --password-stdin"
      # Install Python and dependencies needed by the setup/check scripts
      - "apk add --no-cache python3 py3-pip curl"
      - "pip install --no-cache-dir --break-system-packages requests psycopg[binary] cryptography paho-mqtt"
      - "docker compose up -d --quiet-pull"
      - "sleep 20"
  script:
      # Create a Keycloak test user with the required permission group
      - "python3 .gitlab/ci/py/e2e-setup-user.py"
      #  Create an ingest via the DSM API and capture its UUID and permission group UUID
      - "eval $(python3 -u .gitlab/ci/py/e2e-create-ingest.py)"
      - "sleep 20"
      # Verify Grafana, database, FROST and MinIO provisioning succeeded
      - "python3 .gitlab/ci/py/e2e-check-services.py"
      # Verify the full data flow: publish an MQTT message and confirm it is stored
      - "python3 .gitlab/ci/py/e2e-check-data-flow.py"
  rules:
    # Run if pipeline is triggered by a tag and build job was successful
    - if: "$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED"
      when: on_success
    # Never run if pipeline is triggered by a merge_request_event or a push on main
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_COMMIT_BRANCH == 'main'"
      when: never
    # Run if pipeline is triggered by a push on a branch and build job was successful
    - if: "$CI_PIPELINE_SOURCE == 'push'"
      when: on_success
  tags:
    - "dind"
