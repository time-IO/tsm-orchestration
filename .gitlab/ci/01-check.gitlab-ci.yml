---
check-protected-files:
  stage: check
  script:
    - echo "Files in flyway/migrations MUST NOT be altered! Undo your changes and commit again."
    - exit 1
  rules:
    # Never run if pipeline is triggered by a tag commit, a merge_request_event or a push on main
    - if: "$CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_COMMIT_BRANCH == 'main'"
      when: never
    # Run only if files in flyway/migrations are altered and the commit is not a new branch
    - if: "$CI_COMMIT_BEFORE_SHA !~ /^0000/"
      changes:
        - flyway/migrations/public/V0_1__*
        - flyway/migrations/public/V0_2__*
        - flyway/migrations/public/V0_3__*
        - flyway/migrations/public/V0_4_0__*
        - flyway/migrations/public/V0_4_1__*
        - flyway/migrations/public/V1_1__*
        - flyway/migrations/public/V2_1__*
        - flyway/migrations/public/V2_2__*
        - flyway/migrations/public/V2_3__*
        - flyway/migrations/public/V2_4__*
        - flyway/migrations/public/V2_5__*
        - flyway/migrations/public/V2_6__*
        - flyway/migrations/public/V2_7__*
        - flyway/migrations/public/V2_8__*
        - flyway/migrations/public/V2_9__*
        - flyway/migrations/public/V2_10__*
        - flyway/migrations/public/V2_11__*
        - flyway/migrations/public/V2_12__*
        - flyway/migrations/public/V2_13__*
        - flyway/migrations/public/V2_14__*
        - flyway/migrations/public/V2_15__*

black:
  stage: check
  image: python:3.11-slim
  before_script:
    - pip install black
  script:
    - black --check src/ tests/ data-source-management/api/app/
  rules:
    # Never run if pipeline is triggered by a tag commit, a merge_request_event or a push on main
    - if: "$CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_COMMIT_BRANCH == 'main'"
      when: never
    # Always run if pipeline is triggered by a push on a branch
    - if: "$CI_PIPELINE_SOURCE == 'push'"
      when: always

prettier:
  stage: check
  needs: []
  image: node:25
  before_script:
    - cd data-source-management/frontend/app
    - npm ci
  script:
    - npx prettier --check .
  rules:
    # Never run if pipeline is triggered by a tag commit, a merge_request_event or a push on main
    - if: "$CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_COMMIT_BRANCH == 'main'"
      when: never
    # Always run if pipeline is triggered by a push on a branch
    - if: "$CI_PIPELINE_SOURCE == 'push'"
      when: always
    - changes:
      - data-source-management/frontend/app/**/*

npm-lint:
  stage: check
  needs: []
  image: node:25
  before_script:
    - cd data-source-management/frontend/app
    - npm ci
  script:
    - npm run lint:all
  rules:
    # Never run if pipeline is triggered by a tag commit, a merge_request_event or a push on main
    - if: "$CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_COMMIT_BRANCH == 'main'"
      when: never
    # Always run if pipeline is triggered by a push on a branch
    - if: "$CI_PIPELINE_SOURCE == 'push'"
      when: always
    - changes:
      - data-source-management/frontend/app/**/*

npm-test:
  stage: check
  needs: []
  image: node:25
  before_script:
    - cd data-source-management/frontend/app
    - npm ci
  script:
    # no tests defined yet, but we can already include this job
    - npm run test
  rules:
    # Never run if pipeline is triggered by a tag commit, a merge_request_event or a push on main
    - if: "$CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_COMMIT_BRANCH == 'main'"
      when: never
    # Always run if pipeline is triggered by a push on a branch
    - if: "$CI_PIPELINE_SOURCE == 'push'"
      when: always
    - changes:
      - data-source-management/frontend/app/**/*

pytest-timeio:
  stage: check
  image: python:3.11
  before_script:
    - pip install -r src/requirements.txt
    - pip install pytest
  script:
    - python3 -m pytest tests/test_timeio
  rules:
    # Never run if pipeline is triggered by a tag commit, a merge_request_event or a push on main
    - if: "$CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_COMMIT_BRANCH == 'main'"
      when: never
    # Always run if pipeline is triggered by a push on a branch
    - if: "$CI_PIPELINE_SOURCE == 'push'"
      when: always
    - changes:
        - src/**/*

pytest-dsm-api:
  stage: check
  image: python:3.11
  variables:
    POSTGRES_SERVER: "api-db"
    POSTGRES_PORT: "5432"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "postgres"
    POSTGRES_DB: "db_dev"
    OIDC_WELL_KNOWN: "http://proxy/keycloak/realms/local-dev/.well-known/openid-configuration"
    OIDC_ISSUER: "http://proxy/keycloak/realms/local-dev"
    OIDC_AUDIENCE: "dev-client"
    ALLOWED_VOS: "UFZ-TSM,VO"
    ALLOWED_ORIGINS: "http://localhost"
    MINIO_SFTP_PORT: "127.0.0.1:40022"
    PROXY_URL: "http://localhost:80"
    FERNET_ENCRYPTION_SECRET: "CKoB---DEFAULT-DUMMY-SECRET---0exKVH0QDLy1B="
    STA_ROOT_URL: "https://tsm.ufz.de/sta/"
    STA_VERSION: "/v1.1/"
    MQTT_BROKER_HOST: "mqtt-broker"
    MQTT_PORT: "1883"
    MQTT_CLIENT_ID: "datasource_management"
    MQTT_USER: "dsm"
    MQTT_PASSWORD: "dsm"
    MQTT_QOS: "2"
    INGEST_MQTT_BROKER_URI: "localhost:1883"

  before_script:
    - pip install -r data-source-management/api/requirements.txt
    - pip install pytest

  script:
    - python3 -m pytest data-source-management/api/app/tests

  rules:
    - if: '$CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "main"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
    - changes:
        - data-source-management/api/**/*

check-release-env-file:
  stage: check
  image: python:3.11-slim
  before_script:
    - pip install dotenv click
  script:
    - python3 ./compare_dotenv_files.py .env.example ./releases/release.env
  rules:
    # Never run if pipeline is triggered by a merge_request_event or a push on main
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_COMMIT_BRANCH == 'main'"
      when: never
    # Always run if pipeline is triggered by a push on a branch
    - if: "$CI_PIPELINE_SOURCE == 'push'"
      when: always
