stages:
  - freeze
  - build
  - push

variables:
  HELM_PACKAGE_NAME: "timeio"
  PACKAGE_REGISTRY: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm"
  PACKAGE_REGISTRY_TOKEN: "${CI_JOB_TOKEN}"
  HELM_IMAGE_TAG: "latest"

freeze-tag:
  stage: freeze
  image: alpine
  artifacts:
      expire_in: 6 weeks
      reports:
        dotenv:
          - ci-job-date.env
  script:
    - echo "CI_JOB_DATE=$(date +%Y-%m-%d-%H%M%S)" >> ci-job-date.env

build:
  image: 
    name: alpine/helm:${HELM_IMAGE_TAG}
    entrypoint: [""]
  stage: build
  before_script:
    - apk add yq
  script:
    - helm dependency build timeio
    - VERSION=1.0.0
    - FULL_VERSION="${VERSION}-${CI_JOB_DATE}"
    - echo "Building chart version $FULL_VERSION"
    - helm package timeio --version $FULL_VERSION
  artifacts:
    paths:
      - "./*.tgz"
  only:
    - main


push:
  image: 
    name: alpine/helm:${HELM_IMAGE_TAG}
    entrypoint: [""]
  stage: push
  before_script:
    - CHART=$(ls ./*.tgz)
  script:
    - echo $CI_API_V$_URL
    - echo $CI_PROJECT_NAME
    - 'helm repo add --username gitlab-ci-token --password ${CI_JOB_TOKEN} ${CI_PROJECT_NAME} ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm'
    - 'helm push ${CHART} ${CI_PROJECT_NAME}'
  only:
    - main