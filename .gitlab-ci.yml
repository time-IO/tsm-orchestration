variables:
  API_IMAGE_URL: "${CI_REGISTRY_IMAGE}/timeio-dsm-api"
  FRONTEND_IMAGE_URL: "${CI_REGISTRY_IMAGE}/timeio-dsm-frontend"
  FRONTEND_IMAGE_URL_ROOTLESS: "${CI_REGISTRY_IMAGE}/timeio-dsm-frontend-rootless"
  DOCKER_IMAGE_TAG: 29-cli
  DOCKER_SERVICE_IMAGE_TAG: 29-dind

stages:
  - freeze
  - check
  - build
  - release

freeze:
  stage: freeze
  needs: []
  image: alpine
  artifacts:
    expire_in: 6 weeks
    reports:
      dotenv: date.env
  script:
    - echo "BUILD_DATE=$(date +%Y-%m-%d-%H%M%S)" > date.env

black:
  stage: check
  needs: []
  image: python:3-slim
  before_script:
    - pip install black
  script:
    - black --check api/app/

prettier:
  stage: check
  needs: []
  image: node:25
  before_script:
    - cd frontend/app
    - npm ci
  script:
    - npx prettier --check .

unit-tests:
  stage: check
  needs: []
  image: python:3.13-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3-tk tk
    - pip install -r ./api/requirements.txt
  script:
    - pytest api/app/tests/unit_tests api/app/tests/validation -v -W error

integration-tests:
  stage: check
  needs: []
  image: "docker:${DOCKER_IMAGE_TAG}"
  services:
    - "docker:${DOCKER_SERVICE_IMAGE_TAG}"
  variables:
    OIDC_WELL_KNOWN: "https://example.com/.well-known/openid-configuration"
    OIDC_ISSUER: "https://example.com"
    OIDC_AUDIENCE: "test-audience"
    MINIO_SFTP_PORT: "8022"
    PROXY_URL: "http://localhost"
    FERNET_ENCRYPTION_SECRET: "CKoB---DEFAULT-DUMMY-SECRET---0exKVH0QDLy1B="
    STA_ROOT_URL: "http://localhost/sta"
    STA_VERSION: "v1.1"
    MQTT_BROKER_HOST: "mqtt-broker"
    MQTT_CLIENT_ID: "test-client"
    MQTT_USER: "test"
    MQTT_PASSWORD: "test"
    INGEST_MQTT_BROKER_URI: "mqtt://mqtt-broker:1883"
  before_script:
    - apk add --no-cache bash
    - docker compose build api
    - docker compose up -d --quiet-pull --wait api-db-test mqtt-broker
    - ./api/migrate_test_db.sh
  script:
    - >
      docker compose run --rm
      --no-deps
      -e POSTGRES_TEST_SERVER=api-db-test
      -e POSTGRES_TEST_PORT=5432
      -e POSTGRES_TEST_USER=postgres
      -e POSTGRES_TEST_PASSWORD=postgres
      -e POSTGRES_TEST_DB=db_test
      --entrypoint bash
      api -c "pytest tests/integration_tests/ -v -W error"
  after_script:
    - docker compose down -v
  tags:
    - "dind"

npm-lint:
  stage: check
  needs: []
  image: node:25
  before_script:
    - cd frontend/app
    - npm ci
  script:
    - npm run lint:all

npm-test:
  stage: check
  needs: []
  image: node:25
  before_script:
    - cd frontend/app
    - npm ci
  script:
    # no tests defined yet, but we can already include this job
    - npm run test

docker-build:
  stage: build
  needs:
    - black
    - prettier
    - unit-tests
    - integration-tests
    - npm-lint
    - npm-test
  image: docker
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t ${API_IMAGE_URL}:${CI_COMMIT_REF_NAME} -f ./api/docker/prod/Dockerfile ./api
    - docker build -t ${FRONTEND_IMAGE_URL}:${CI_COMMIT_REF_NAME} -f ./frontend/docker/generic-image/Dockerfile ./frontend
    - docker build -t ${FRONTEND_IMAGE_URL_ROOTLESS}:${CI_COMMIT_REF_NAME} -f ./frontend/docker/generic-image/Dockerfile-rootless ./frontend
    - docker push ${API_IMAGE_URL}:${CI_COMMIT_REF_NAME}
    - docker push ${FRONTEND_IMAGE_URL}:${CI_COMMIT_REF_NAME}
    - docker push ${FRONTEND_IMAGE_URL_ROOTLESS}:${CI_COMMIT_REF_NAME}
  tags:
    - "dind"

add-latest-tags:
  stage: release
  needs:
    - freeze
    - docker-build
  rules:
    - if: '$CI_COMMIT_REF_SLUG == "main"'
      when: on_success
  image: docker
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker pull ${API_IMAGE_URL}:${CI_COMMIT_REF_NAME}
    - docker pull ${FRONTEND_IMAGE_URL}:${CI_COMMIT_REF_NAME}
    - docker pull ${FRONTEND_IMAGE_URL_ROOTLESS}:${CI_COMMIT_REF_NAME}
    - docker tag ${API_IMAGE_URL}:${CI_COMMIT_REF_NAME} ${API_IMAGE_URL}:latest
    - docker tag ${API_IMAGE_URL}:${CI_COMMIT_REF_NAME} ${API_IMAGE_URL}:${BUILD_DATE}
    - docker tag ${FRONTEND_IMAGE_URL}:${CI_COMMIT_REF_NAME} ${FRONTEND_IMAGE_URL}:latest
    - docker tag ${FRONTEND_IMAGE_URL}:${CI_COMMIT_REF_NAME} ${FRONTEND_IMAGE_URL}:${BUILD_DATE}
    - docker tag ${FRONTEND_IMAGE_URL_ROOTLESS}:${CI_COMMIT_REF_NAME} ${FRONTEND_IMAGE_URL_ROOTLESS}:latest
    - docker tag ${FRONTEND_IMAGE_URL_ROOTLESS}:${CI_COMMIT_REF_NAME} ${FRONTEND_IMAGE_URL_ROOTLESS}:${BUILD_DATE}
    - docker push ${API_IMAGE_URL} -a
    - docker push ${FRONTEND_IMAGE_URL} -a
    - docker push ${FRONTEND_IMAGE_URL_ROOTLESS} -a
  tags:
    - "dind"
