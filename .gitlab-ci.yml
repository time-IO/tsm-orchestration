stages:
  - test
  - build
  - push
  - promote

variables:
  HELM_PACKAGE_NAME: "timeio"
  PACKAGE_REGISTRY: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm"
  PACKAGE_REGISTRY_TOKEN: "${CI_JOB_TOKEN}"
  HELM_IMAGE_TAG: "latest"
  OCI_HELM_REPO: "${CI_REGISTRY_IMAGE}"
  ENABLE_CLASSIC_PUSH: "true"
  ENABLE_OCI_PUSH: "true"

lint:
  image:
    name: alpine/helm:${HELM_IMAGE_TAG}
    entrypoint: [""]
  stage: test
  script:
    - helm lint timeio

template:
  image:
    name: alpine/helm:${HELM_IMAGE_TAG}
    entrypoint: [""]
  stage: test
  script:
    - helm dependency build timeio || exit 1
    - helm template timeio > /dev/null || exit 1


build:
  image: 
    name: alpine/helm:${HELM_IMAGE_TAG}
    entrypoint: [""]
  stage: build
  script:
    - apk add yq
    - CI_JOB_DATE=$(date +%Y-%m-%d-%H%M%S)
    - helm dependency build timeio
    - VERSION=$(helm show chart timeio | yq .version | tr -d '\n')
    - FULL_VERSION="${VERSION}"
    - echo "Building chart version $FULL_VERSION"
    - helm package timeio --version $FULL_VERSION
    - CHART="${HELM_PACKAGE_NAME}-${FULL_VERSION}.tgz"
    - test -f "$CHART"
    - ARCHIVE_SHA256=$(sha256sum "$CHART" | awk '{print $1}')
    - |
      {
        printf 'TIMEIO_CHART_VERSION=%s\n' "$FULL_VERSION"
        printf 'TIMEIO_CHART_ARCHIVE_SHA256=%s\n' "$ARCHIVE_SHA256"
      } > timeio-build.env
  artifacts:
    paths:
      - "./*.tgz"
    reports:
      dotenv: timeio-build.env
  only:
    - main


push_classic:
  image: alpine
  stage: push
  before_script:
    - apk add curl
    - CHART=$(ls ./*.tgz)
  script:
    - curl --fail-with-body --request POST --user gitlab-ci-token:${CI_JOB_TOKEN} --form chart=@${CHART} ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/api/stable/charts
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $ENABLE_CLASSIC_PUSH == "true"'


push_oci:
  image:
    name: alpine/helm:${HELM_IMAGE_TAG}
    entrypoint: [""]
  stage: push
  before_script:
    - CHART=$(ls ./*.tgz)
  script:
    - helm registry login -u gitlab-ci-token -p "${CI_JOB_TOKEN}" "${CI_REGISTRY}"
    - PUSH_OUTPUT=$(helm push "${CHART}" "oci://${OCI_HELM_REPO}")
    - printf '%s\n' "$PUSH_OUTPUT"
    - TIMEIO_CHART_MANIFEST_DIGEST=$(printf '%s\n' "$PUSH_OUTPUT" | awk '/^Digest:/ { print $2 }')
    - test -n "$TIMEIO_CHART_MANIFEST_DIGEST"
    - |
      {
        # Helm appends the chart name to the OCI repository on push; the
        # downstream promotion must therefore receive that complete reference.
        printf 'TIMEIO_CHART_REF=oci://%s/%s\n' "$OCI_HELM_REPO" "$HELM_PACKAGE_NAME"
        printf 'TIMEIO_CHART_VERSION=%s\n' "$TIMEIO_CHART_VERSION"
        printf 'TIMEIO_CHART_MANIFEST_DIGEST=%s\n' "$TIMEIO_CHART_MANIFEST_DIGEST"
        printf 'TIMEIO_CHART_ARCHIVE_SHA256=%s\n' "$TIMEIO_CHART_ARCHIVE_SHA256"
      } > timeio-push.env
  needs:
    - job: build
      artifacts: true
  artifacts:
    reports:
      dotenv: timeio-push.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $ENABLE_OCI_PUSH == "true"'

promote_test:
  image: curlimages/curl:8.16.0
  stage: promote
  needs:
    - job: push_oci
      artifacts: true
  script:
    - test -n "${UFZ_DEPLOYMENT_TRIGGER_TOKEN:-}"
    - |
      curl --fail-with-body --request POST \
        --form "token=${UFZ_DEPLOYMENT_TRIGGER_TOKEN}" \
        --form "ref=main" \
        --form "variables[TIMEIO_PROMOTION_TARGET]=test" \
        --form "variables[TIMEIO_CHART_REF]=${TIMEIO_CHART_REF}" \
        --form "variables[TIMEIO_CHART_VERSION]=${TIMEIO_CHART_VERSION}" \
        --form "variables[TIMEIO_CHART_MANIFEST_DIGEST]=${TIMEIO_CHART_MANIFEST_DIGEST}" \
        --form "variables[TIMEIO_CHART_ARCHIVE_SHA256]=${TIMEIO_CHART_ARCHIVE_SHA256}" \
        "${CI_API_V4_URL}/projects/21266/trigger/pipeline"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $ENABLE_OCI_PUSH == "true"'
