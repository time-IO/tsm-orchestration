variables:
  API_IMAGE_URL: "${CI_REGISTRY_IMAGE}/timeio-dsm-api"
  FRONTEND_IMAGE_URL: "${CI_REGISTRY_IMAGE}/timeio-dsm-frontend"

stages:
  - freeze
  - check
  - build
  - release


freeze:
  stage: freeze
  needs: []
  image: alpine
  artifacts:
    expire_in: 6 weeks
    reports:
      dotenv: date.env
  script:
    - echo "BUILD_DATE=$(date +%Y-%m-%d-%H%M%S)" > date.env


black:
  stage: check
  needs: []
  image: python:3-slim
  before_script:
    - pip install black
  script:
    - black --check api/app/

api-test:
  stage: check
  needs: []
  image: python:3-slim
  variables:
    POSTGRES_SERVER: "api-db"
    POSTGRES_PORT: "5432"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "postgres"
    POSTGRES_DB: "db_dev"
    OIDC_WELL_KNOWN: "http://proxy/keycloak/realms/local-dev/.well-known/openid-configuration"
    OIDC_ISSUER: "http://proxy/keycloak/realms/local-dev"
    OIDC_AUDIENCE: "dev-client"
    ALLOWED_VOS: "UFZ-TSM,VO"
    ALLOWED_ORIGINS: "http://localhost"
    MINIO_SFTP_PORT: "127.0.0.1:40022"
    PROXY_URL: "http://localhost:80"
    FERNET_ENCRYPTION_SECRET: "CKoB---DEFAULT-DUMMY-SECRET---0exKVH0QDLy1B="
    STA_ROOT_URL: "https://tsm.ufz.de/sta/"
    STA_VERSION: "/v1.1/"
    MQTT_BROKER_HOST: "mqtt-broker"
    MQTT_PORT: "1883"
    MQTT_CLIENT_ID: "datasource_management"
    MQTT_USER: "dsm"
    MQTT_PASSWORD: "dsm"
    MQTT_QOS: "2"
  before_script:
    - pip install -r ./api/requirements.txt
  script:
    - pytest

npm-lint:
  stage: check
  needs: []
  image: node:25
  before_script:
    - cd frontend/app
    - npm ci
  script:
    - npm run lint:all


npm-test:
  stage: check
  needs: []
  image: node:25
  before_script:
    - cd frontend/app
    - npm ci
  script:
    # no tests defined yet, but we can already include this job
    - npm run test


docker-build:
  stage: build
  needs:
    - black
    - npm-lint
    - npm-test
  image: docker
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t ${API_IMAGE_URL}:${CI_COMMIT_REF_NAME} -f ./api/docker/prod/Dockerfile ./api
    - docker build -t ${FRONTEND_IMAGE_URL}:${CI_COMMIT_REF_NAME} -f ./frontend/docker/generic-image/Dockerfile ./frontend
    - docker push ${API_IMAGE_URL}:${CI_COMMIT_REF_NAME}
    - docker push ${FRONTEND_IMAGE_URL}:${CI_COMMIT_REF_NAME}
  tags:
    - "dind"

add-latest-tags:
  stage: release
  needs:
    - freeze
    - docker-build
  rules:
    - if: '$CI_COMMIT_REF_SLUG == "main"'
      when: on_success
  image: docker
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker pull ${API_IMAGE_URL}:${CI_COMMIT_REF_NAME}
    - docker pull ${FRONTEND_IMAGE_URL}:${CI_COMMIT_REF_NAME}
    - docker tag ${API_IMAGE_URL}:${CI_COMMIT_REF_NAME} ${API_IMAGE_URL}:latest
    - docker tag ${API_IMAGE_URL}:${CI_COMMIT_REF_NAME} ${API_IMAGE_URL}:${BUILD_DATE}
    - docker tag ${FRONTEND_IMAGE_URL}:${CI_COMMIT_REF_NAME} ${FRONTEND_IMAGE_URL}:latest
    - docker tag ${FRONTEND_IMAGE_URL}:${CI_COMMIT_REF_NAME} ${FRONTEND_IMAGE_URL}:${BUILD_DATE}
    - docker push ${API_IMAGE_URL} -a
    - docker push ${FRONTEND_IMAGE_URL} -a
  tags:
    - "dind"
