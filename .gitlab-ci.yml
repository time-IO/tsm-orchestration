stages:
  - build
  - push

variables:
  HELM_PACKAGE_NAME: "timeio"
  PACKAGE_REGISTRY: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm"
  PACKAGE_REGISTRY_TOKEN: "${CI_JOB_TOKEN}"

build:
  image: alpine/helm
  stage: build
  before_script:
    - apk add yq
  script:
    - helm dep build timeio
    - VERSION=$(helm show chart | yq .version | tr -d '\n')
    - FULL_VERSION="$VERSION-${CI_COMMIT_BRANCH:-${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}}-$CI_COMMIT_SHORT_SHA"
    - echo "Building chart version $FULL_VERSION"
    - helm package timeio --version $FULL_VERSION
  artifacts:
    paths:
      - "./*.tgz"
  only:
    - main

push:
  image: alpine/helm
  stage: push
  dependencies:
    - build
  script:
    - ls -la *.tgz
    - ls -la
    - helm repo index . --url $PACKAGE_REGISTRY
    - helm repo ls
    - echo $PACKAGE_REGISTRY_TOKEN
    - echo $HELM_PACKAGE_NAME
    - echo $PACKAGE_REGISTRY
    #- "curl --header \"JOB-TOKEN: $PACKAGE_REGISTRY_TOKEN\" --upload-file ./${HELM_PACKAGE_NAME}*.tgz ${PACKAGE_REGISTRY}/${HELM_PACKAGE_NAME}*.tgz"
    #- "curl --header \"JOB-TOKEN: $PACKAGE_REGISTRY_TOKEN\" --upload-file ./index.yaml ${PACKAGE_REGISTRY}/index.yaml"
  only:
    - main