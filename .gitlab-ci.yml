stages:
  - freeze
  - test
  - build

freeze:
  stage: freeze
  needs: []
  image: alpine
  artifacts:
    expire_in: 6 weeks
    reports:
      dotenv: date.env
  script:
    - echo "BUILD_DATE=$(date +%Y-%m-%d-%H%M%S)" > date.env

black:
  stage: test
  needs: []
  image: python:3-slim
  before_script:
    - pip install black
  script:
    - black --check api/app/

npm-lint:
  stage: test
  needs: []
  image: node:25
  before_script:
    - cd frontend/app
    - npm ci
  script:
    - npm run lint

npm-test:
  stage: test
  needs: []
  image: node:25
  before_script:
    - cd frontend/app
    - npm ci
  script:
    # no tests defined yet, but we can already include that here
    - npm run test

npm-build:
  stage: build
  needs:
    - npm-lint
    - npm-test
  image: node:25
  before_script:
    - cd frontend/app
    - npm ci
  script:
    - npm run build


docker-build:
  stage: build
  needs:
    - freeze
    - black
    - npm-lint
    - npm-test
  image: docker
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - apk add --no-cache jq
    - export DSM_API_IMAGE_NAME=$(docker compose config --format json | jq -r '.services.api.image | split(":")[0]')
    - export DSM_FRONTEND_IMAGE_NAME=$(docker compose config --format json | jq -r '.services.frontend.image | split(":")[0]')
    - export DSM_API_IMAGE_URL="${CI_REGISTRY_IMAGE}/${DSM_API_IMAGE_NAME}"
    - export DSM_FRONTEND_IMAGE_URL="${CI_REGISTRY_IMAGE}/${DSM_FRONTEND_IMAGE_NAME}"
  script:
    - docker compose build
    - export DSM_API_IMAGE_ID=$(docker images -f reference=${DSM_API_IMAGE_NAME} -q)
    - export DSM_FRONTEND_IMAGE_ID=$(docker images -f reference=${DSM_FRONTEND_IMAGE_NAME} -q)
    - docker tag ${DSM_API_IMAGE_ID} ${DSM_API_IMAGE_URL}:${BUILD_DATE}
    - docker tag ${DSM_FRONTEND_IMAGE_ID} ${DSM_FRONTEND_IMAGE_URL}:${BUILD_DATE}
    - docker tag ${DSM_API_IMAGE_ID} ${DSM_API_IMAGE_URL}:${CI_COMMIT_REF_NAME}
    - docker tag ${DSM_FRONTEND_IMAGE_ID} ${DSM_FRONTEND_IMAGE_URL}:${CI_COMMIT_REF_NAME}
    - docker images
    - docker push ${DSM_API_IMAGE_URL}:${BUILD_DATE}
    - docker push ${DSM_FRONTEND_IMAGE_URL}:${BUILD_DATE}
    - docker push ${DSM_API_IMAGE_URL}:${CI_COMMIT_REF_NAME}
    - docker push ${DSM_FRONTEND_IMAGE_URL}:${CI_COMMIT_REF_NAME}
  tags:
    - "dind"
