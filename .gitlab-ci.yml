stages:
  - freeze
  - test
  - build
  - release


freeze:
  stage: freeze
  needs: []
  image: alpine
  artifacts:
    expire_in: 6 weeks
    reports:
      dotenv: date.env
  script:
    - echo "BUILD_DATE=$(date +%Y-%m-%d-%H%M%S)" > date.env


black:
  stage: test
  needs: []
  image: python:3-slim
  before_script:
    - pip install black
  script:
    - black --check api/app/


npm-lint:
  stage: test
  needs: []
  image: node:25
  before_script:
    - cd frontend/app
    - npm ci
  script:
    - npm run lint


npm-test:
  stage: test
  needs: []
  image: node:25
  before_script:
    - cd frontend/app
    - npm ci
  script:
    # no tests defined yet, but we can already include that here
    - npm run test


npm-build:
  stage: test
  needs:
    - npm-lint
    - npm-test
  image: node:25
  before_script:
    - cd frontend/app
    - npm ci
  script:
    - npm run build


docker-build:
  stage: build
  needs:
    - freeze
    - black
    - npm-lint
    - npm-test
  image: docker
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - apk add --no-cache jq
    - export API_IMAGE_NAME=$(docker compose config --format json | jq -r '.services.api.image | split(":")[0]')
    - export FRONTEND_IMAGE_NAME=$(docker compose config --format json | jq -r '.services.frontend.image | split(":")[0]')
    - export API_IMAGE_URL="${CI_REGISTRY_IMAGE}/${API_IMAGE_NAME}"
    - export FRONTEND_IMAGE_URL="${CI_REGISTRY_IMAGE}/${FRONTEND_IMAGE_NAME}"
  script:
    - docker compose build
    - export API_IMAGE_ID=$(docker images -f reference=${API_IMAGE_NAME} -q)
    - export FRONTEND_IMAGE_ID=$(docker images -f reference=${FRONTEND_IMAGE_NAME} -q)
    - docker tag ${API_IMAGE_ID} ${API_IMAGE_URL}:${BUILD_DATE}
    - docker tag ${FRONTEND_IMAGE_ID} ${FRONTEND_IMAGE_URL}:${BUILD_DATE}
    - docker tag ${API_IMAGE_ID} ${API_IMAGE_URL}:${CI_COMMIT_REF_NAME}
    - docker tag ${FRONTEND_IMAGE_ID} ${FRONTEND_IMAGE_URL}:${CI_COMMIT_REF_NAME}
    - docker images
    - docker push ${API_IMAGE_URL}:${BUILD_DATE}
    - docker push ${FRONTEND_IMAGE_URL}:${BUILD_DATE}
    - docker push ${API_IMAGE_URL}:${CI_COMMIT_REF_NAME}
    - docker push ${FRONTEND_IMAGE_URL}:${CI_COMMIT_REF_NAME}
  tags:
    - "dind"

add-latest-tags:
  stage: release
  needs: 
    - docker-build
  rules:
    - if: '$CI_COMMIT_REF_SLUG == "main"'
      when: on_success
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker pull ${API_IMAGE_URL}:${BUILD_DATE}
    - docker pull ${FRONTEND_IMAGE_URL}:${BUILD_DATE}
    - docker tag ${API_IMAGE_URL}:${BUILD_DATE} ${API_IMAGE_URL}:latest
    - docker tag ${FRONTEND_IMAGE_URL}:${BUILD_DATE} ${FRONTEND_IMAGE_URL}:latest
    - docker push ${API_IMAGE_URL}:latest