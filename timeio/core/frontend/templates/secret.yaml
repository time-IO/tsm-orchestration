  CREATEDB_POSTGRES_HOST: "{{  .Values.global.secrets.CREATEDB_POSTGRES_HOST }}"
  CREATEDB_POSTGRES_DATABASE: "{{  .Values.global.secrets.CREATEDB_POSTGRES_DATABASE }}"
  MQTT_BROKER_HOST: "{{  .Values.global.secrets.FRONTEND_MQTT_HOST }}"
  MQTT_BROKER_PORT: "{{  .Values.global.secrets.FRONTEND_MQTT_PORT }}"
  MQTT_USER: "{{  .Values.global.secrets.FRONTEND_MQTT_USER }}"
  MQTT_PASSWORD: "{{  .Values.global.secrets.FRONTEND_MQTT_PASS }}"
  DJANGO_SUPERUSER_USERNAME: "{{  .Values.global.secrets.FRONTEND_DJANGO_SUPERUSER_USERNAME }}"
  DJANGO_SUPERUSER_PASSWORD: "{{  .Values.global.secrets.FRONTEND_DJANGO_SUPERUSER_PASSWORD }}"
  DJANGO_SUPERUSER_EMAIL: "{{  .Values.global.secrets.FRONTEND_DJANGO_SUPERUSER_EMAIL }}"
  DJANGO_SECRET_KEY: "{{  .Values.global.secrets.DJANGO_SECRET_KEY }}"
