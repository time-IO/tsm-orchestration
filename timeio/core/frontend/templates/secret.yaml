  MINIO_FTP_PORT: "{{  .Values.global.secrets.MINIO_FTP_PORT }}"
  MINIO_SFTP_PORT: "{{  .Values.global.secrets.MINIO_SFTP_PORT }}"
  PROXY_URL: "{{  .Values.global.secrets.PROXY_URL }}"
  ALLOWED_VOS: "{{  .Values.global.secrets.ALLOWED_VOS }}"