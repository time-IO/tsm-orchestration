apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-secret
type: Opaque
stringData:
  POSTGRES_HOST: "{{ .Values.envvars.FRONTEND_POSTGRES_HOST }}"
  POSTGRES_PORT: "{{ .Values.envvars.FRONTEND_POSTGRES_PORT }}"
  POSTGRES_NAME: "{{ .Values.envvars.FRONTEND_POSTGRES_DB }}"
  POSTGRES_USER: "{{ .Values.envvars.FRONTEND_POSTGRES_USER }}"
  POSTGRES_PASSWORD: "{{ .Values.envvars.FRONTEND_POSTGRES_PASS }}"
  PUBLISH_THING_TO_BROKER: "True"
  CREATEDB_POSTGRES_HOST: "{{ .Values.envvars.CREATEDB_POSTGRES_HOST }}"
  CREATEDB_POSTGRES_DATABASE: "{{ .Values.envvars.CREATEDB_POSTGRES_DATABASE }}"
  MQTT_BROKER_HOST: "{{ .Values.envvars.FRONTEND_MQTT_HOST }}"
  MQTT_BROKER_PORT: "{{ .Values.envvars.FRONTEND_MQTT_PORT }}"
  MQTT_USER: "{{ .Values.envvars.FRONTEND_MQTT_USER }}"
  MQTT_PASSWORD: "{{ .Values.envvars.FRONTEND_MQTT_PASS }}"
  DJANGO_SUPERUSER_USERNAME: "{{ .Values.envvars.FRONTEND_DJANGO_SUPERUSER_USERNAME }}"
  DJANGO_SUPERUSER_PASSWORD: "{{ .Values.envvars.FRONTEND_DJANGO_SUPERUSER_PASSWORD }}"
  DJANGO_SUPERUSER_EMAIL: "{{ .Values.envvars.FRONTEND_DJANGO_SUPERUSER_EMAIL }}"
  DJANGO_SECRET_KEY: "{{ .Values.envvars.DJANGO_SECRET_KEY }}"
  DJANGO_DEBUG: "{{ .Values.envvars.DJANGO_DEBUG }}"
  DJANGO_TRUSTED_ORIGINS: "{{ .Values.envvars.PROXY_URL }}"
  DJANGO_BASE_PATH: "{{ .Values.envvars.DJANGO_BASE_PATH }}"
  DJANGO_ALLOWED_HOSTS: "{{ .Values.envvars.DJANGO_ALLOWED_HOSTS }}"
  POSTGRES_SSLMODE: "{{ .Values.envvars.DJANGO_POSTGRES_SSLMODE }}"
  DJANGO_HELMHOLTZ_CLIENT_ID: "{{ .Values.envvars.OIDC_CLIENT_ID }}"
  DJANGO_HELMHOLTZ_CLIENT_SECRET: "{{ .Values.envvars.OIDC_CLIENT_SECRET }}"
  DJANGO_HELMHOLTZ_AAI_CONF_URL: "{{ .Values.envvars.OIDC_CONF_URL }}"
  MINIO_FTP_PORT: "{{ .Values.envvars.MINIO_FTP_PORT }}"
  MINIO_SFTP_PORT: "{{ .Values.envvars.MINIO_SFTP_PORT }}"
  PROXY_URL: "{{ .Values.envvars.PROXY_URL }}"
  ALLOWED_VOS: "{{ .Values.envvars.ALLOWED_VOS }}"