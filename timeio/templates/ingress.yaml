apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.global.ingress.service.name }}-ingress
spec:
  tls:
  - hosts:
    - {{ .Values.global.ingress.host }}
    secretName: {{ .Values.global.ingress.tls.secretName }}
  rules:
  - host: {{ .Values.global.ingress.host }}
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: {{ .Values.global.ingress.service.name }}
            port:
              number: {{ .Values.global.ingress.service.port | int }}