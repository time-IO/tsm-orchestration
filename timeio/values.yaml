# local PostgreSQL chart using postgis/postgis image
database:
  enabled: true
  image:
    repository: postgis/postgis
    tag: "17-3.5"
  fullnameOverride: "database"
  auth:
    username: "postgres"
    password: "postgres"
    database: "postgres"
  persistence:
    enabled: false
    storageClass: ""
    size: 1Gi
  persistentVolumeClaimRetentionPolicy:
    enabled: true
    whenDeleted: "Delete"
  containerSecurityContext:
    seccompProfile:
      type: "RuntimeDefault"

global:

  # Public browser-facing URL for this TimeIO instance. The localhost default
  # supports quick standalone installs via port-forwarding; GitOps and
  # production deployments must override this with their real external URL.
  publicUrl: "http://localhost"
  publicHost: "localhost"

  pvc:
    # Leave unset by default so generic clusters can use their default
    # StorageClass. Override explicitly for cluster-specific deployments.
    storageClassName: ""
    createPVC: true

  createSecrets: true
  createConfigMaps: true
  secrets:
    # Database credentials
    CREATEDB_POSTGRES_USER: "postgres"
    CREATEDB_POSTGRES_PASSWORD: "postgres"
    MQTT_AUTH_POSTGRES_USER: "db_mqtt_auth"
    MQTT_AUTH_POSTGRES_PASS: "db_mqtt_auth"
    FRONTEND_POSTGRES_USER: "db_frontend"
    FRONTEND_POSTGRES_PASS: "db_frontend"
    CONFIGDB_POSTGRES_USER: "db_config"
    CONFIGDB_POSTGRES_PASSWORD: "db_config"
    DSM_API_DATABASE_USER: "db_dsm"
    DSM_API_DATABASE_PASS: "db_dsm"
    KEYCLOAK_DB_USER: "db_keycloak"
    KEYCLOAK_DB_PASSWORD: "db_keycloak"
    MONITORING_DB_USER: "db_monitoring"
    MONITORING_DB_PASSWORD: "db_monitoring"
    # MQTT credentials
    MQTT_USER: "mqtt_dispatcher"
    MQTT_PASSWORD: "mqtt_dispatcher"
    MQTT_INGEST_USER: "mqtt_ingest"
    MQTT_INGEST_PASSWORD: "mqtt_ingest"
    FRONTEND_MQTT_USER: "mqtt_frontend"
    FRONTEND_MQTT_PASS: "mqtt_frontend"
    # Grafana credentials
    GRAFANA_USER: "admin_grafana"
    GRAFANA_PASSWORD: "admin_grafana"
    # MinIO credentials
    MINIO_ROOT_USER: "admin_minio"
    MINIO_ROOT_PASSWORD: "admin_minio"
    # Keycloak credentials
    KEYCLOAK_ADMIN_USER: "admin_keycloak"
    KEYCLOAK_ADMIN_PASS: "admin_keycloak"
    # OIDC credentials
    KEYCLOAK_DSM_CLIENT_ID: "dsm-oidc-client"
    KEYCLOAK_GRAFANA_CLIENT_ID: "grafana-oidc-client"
    KEYCLOAK_GRAFANA_CLIENT_SECRET: "000000000000000000000000000000000"
    KEYCLOAK_GENERIC_OIDC_CLIENT: "timeio-thing-management"
    # DB API tokens
    DB_API_AUTH_TOKEN_ADMIN: "local_bearer_token_admin"
    DB_API_AUTH_TOKEN_INGEST: "local_bearer_token_ingest"
    DB_API_AUTH_TOKEN_PROCESSING: "local_bearer_token_processing"
    # SMS credentials
    SMS_DB_USER: "postgres"
    SMS_DB_PASSWORD: "postgres"
    SMS_API_TOKEN: ""
    CV_DB_USER: "postgres"
    CV_DB_PASSWORD: "postgres"
    # Encryption secret
    FERNET_ENCRYPTION_SECRET: "tl6rVmqwjRn3PDuAjxppMYxpDEv0UKuCgqFr8Q5p8_4="

  envvars:
    LOG_LEVEL: "INFO"
    TSM_DL_ENVIRONMENT: "local"
    CREATEDB_POSTGRES_HOST: "database"
    CREATEDB_POSTGRES_DATABASE: "postgres"
    CONFIGDB_POSTGRES_HOST: "database"
    CONFIGDB_POSTGRES_DATABASE: "postgres"
    MQTT_AUTH_POSTGRES_HOST: "database"
    MQTT_AUTH_POSTGRES_PORT: "5432"
    MQTT_AUTH_POSTGRES_DB: "postgres"
    MQTT_AUTH_PG_TLSMODE: "disable"
    MQTT_QOS: "1"
    MQTT_CLEAN_SESSION: "True"
    MQTT_BROKER_FILE_COUNT: "10"
    MQTT_CAT_LOG_SIZE: "100k"
    FRONTEND_POSTGRES_HOST: "database"
    FRONTEND_POSTGRES_PORT: "5432"
    FRONTEND_POSTGRES_DB: "postgres"
    FRONTEND_MQTT_HOST: "mosquitto"
    FRONTEND_MQTT_PORT: "1883"
    SMS_DB_PORT: "5432"
    SMS_DB_DB: "postgres"
    SMS_DB_HOST: "database"
    SMS_URL: "https://local.host/sms/"
    SMS_ACCESS_TYPE: "db"
    CV_DB_PORT: "5432"
    CV_DB_DB: "postgres"
    CV_DB_HOST: "database"
    CV_URL: "https://local.host/sms/cv/"
    CV_ACCESS_TYPE: "db"
    GRAFANA_URL: "http://visualization:3000"
    GRAFANA_DEFAULT_DATASOURCE_SSLMODE: "disable"
    ALLOWED_VOS: "VO"
    KC_DB: "postgres"
    KC_DB_URL: "jdbc:postgresql://database:5432/postgres"
    KC_PROXY_HEADERS: "xforwarded"
    KC_HTTP_ENABLED: "true"
    KC_START_COMMAND: "start"
    KC_LOG_LEVEL: "INFO"
    KEYCLOAK_GENERIC_OIDC_ALIAS: "oidc-proxy"
    KEYCLOAK_THING_MANAGEMENT_CLIENT_BASE_URL: "https://login-dev.helmholtz.de"
    KEYCLOAK_GENERIC_OIDC_ISSUER: "https://login-dev.helmholtz.de/oauth2"
    KEYCLOAK_GENERIC_OIDC_AUTH_URL: "https://login-dev.helmholtz.de/oauth2-as/oauth2-authz"
    KEYCLOAK_GENERIC_OIDC_TOKEN_URL: "https://login-dev.helmholtz.de/oauth2/token"
    KEYCLOAK_GENERIC_OIDC_USERINFO_URL: "https://login-dev.helmholtz.de/oauth2/userinfo"
    KEYCLOAK_GENERIC_OIDC_JWKS_URL: "https://login-dev.helmholtz.de/oauth2/jwk"
    KEYCLOAK_GENERIC_OIDC_CONF_URL: "https://login-dev.helmholtz.de/oauth2/.well-known/openid-configuration"
    MINIO_PORT: "9000"
    MINIO_HOST: "object-storage:9000"
    MINIO_SECURE: "false"
    MINIO_NOTIFY_MQTT_ENABLE_LOCAL_BROKER: "on"
    MINIO_NOTIFY_MQTT_BROKER_LOCAL_BROKER: "tcp://mosquitto:1883"
    MINIO_NOTIFY_MQTT_TOPIC_LOCAL_BROKER: "object_storage_notification"
    MINIO_NOTIFY_MQTT_QOS_LOCAL_BROKER: "1"
    MINIO_NOTIFY_MQTT_KEEP_ALIVE_INTERVAL_LOCAL_BROKER: "60s"
    MINIO_NOTIFY_MQTT_RECONNECT_INTERVAL_LOCAL_BROKER: "60s"
    MINIO_FTP_PORT: "40021"
    MINIO_SFTP_PORT: "40022"
    DJANGO_DEBUG: 1
    DJANGO_BASE_PATH: "/frontend/"
    DJANGO_ALLOWED_HOSTS: "localhost,.localhost,127.0.0.1,[::1]"
    DJANGO_POSTGRES_SSLMODE: "disable"
    FRONTEND_DJANGO_SUPERUSER_EMAIL: "example@example.com"
    CRON_SETUP_SERVICE: "true"
    FLYWAY_BASELINE_VERSION: "0.0.1"
    FLYWAY_THING_MANAGEMENT_BASELINE_VERSION: "0.0.1"
    DB_API_BASE_URL: "http://timeio-db-api:8001"
    DSM_API_ROOT_PATH: "/data-source-management/api"
    JOURNALING: "true"
    SAQC_VERSION: "v2.6.0"
    THING_MANAGEMENT_ENVIRONMENT: "production"


