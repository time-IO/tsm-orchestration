{{- if .Values.enabled }}
{{- if .Values.global.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-secret
type: Opaque
stringData:
  MQTT_USER: {{ .Values.global.secrets.MQTT_USER | quote }}
  MQTT_PASSWORD: {{ .Values.global.secrets.MQTT_PASSWORD | quote }}
  FERNET_ENCRYPTION_SECRET: {{ .Values.global.secrets.FERNET_ENCRYPTION_SECRET | quote }}
  DSMDB_DSN: "postgresql://{{-  .Values.global.secrets.DSM_API_DATABASE_USER -}}:{{-  .Values.global.secrets.DSM_API_DATABASE_PASS -}}@{{-  .Values.global.envvars.CREATEDB_POSTGRES_HOST -}}:5432/{{-  .Values.global.envvars.CREATEDB_POSTGRES_DATABASE -}}"
  MINIO_USER: {{ .Values.global.secrets.MINIO_ROOT_USER | quote }}
  MINIO_PASSWORD: {{ .Values.global.secrets.MINIO_ROOT_PASSWORD | quote }}
{{- end }}
{{- end }}