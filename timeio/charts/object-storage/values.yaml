replicaCount: 1

enabled: true

image:
  repository: "minio/minio"
  tag: "RELEASE.2025-09-07T16-13-09Z"
  pullPolicy: Always
name: object-storage

securityContext:
  allowPrivilegeEscalation: False
  capabilities:
    drop: ["ALL"]
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

env: []

existingSecret: ""
existingConfigMap: ""

ftp:
  enabled: false
  port: 40021
  passivePortRange:
    enabled: false
    start: 30000
    end: 30010
  tls:
    enabled: false
    existingSecret: ""
    privateKeyKey: minio-ftp.key
    publicCertKey: minio-ftp.crt

sftp:
  enabled: false
  port: 40022
  sshPrivateKey:
    existingSecret: ""
    key: id_ed25519

certs:
  mountPath: /minio/certs
