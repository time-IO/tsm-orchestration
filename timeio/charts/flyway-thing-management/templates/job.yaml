{{- $secretName := "" }}
{{- if .Values.global.createSecrets }}
  {{- $secretName = printf "%s-secret" .Values.name }}
{{- else }}
  {{- $secretName = index .Values.global .Values.name "existingSecret" }}
{{- end }}

apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
      annotations:
        checksum/conf-cm: {{ include (print $.Template.BasePath "/conf-CM.yaml") . | sha256sum }}
        checksum/envvars: {{ include (print $.Template.BasePath "/envvars.yaml") . | sha256sum }}
        checksum/migrations-cm: {{ include (print $.Template.BasePath "/migrations-CM.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      restartPolicy: {{ .Values.restartPolicy }}
      containers:
        - name: {{ .Values.name }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - migrate
          volumeMounts:
            - mountPath: /flyway/sql
              name: {{ .Values.name }}-migrations
              readOnly: true
            - mountPath: /flyway/conf
              name: {{ .Values.name }}-conf
              readOnly: true
          envFrom:
          - configMapRef:
              name: {{ .Values.name }}-envvars
          - secretRef:
              name: {{ $secretName }}
          securityContext:
            runAsUser: {{ .Values.securityContext.runAsUser }}
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            capabilities:
              drop: {{ .Values.securityContext.capabilities.drop }}
            runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
            seccompProfile:
              type: {{ .Values.securityContext.seccompProfile.type }}
      volumes:
        - name: {{ .Values.name }}-migrations
          configMap:
            name: {{ .Values.name }}-migrations
        - name: {{ .Values.name }}-conf
          configMap:
            name: {{ .Values.name }}-conf