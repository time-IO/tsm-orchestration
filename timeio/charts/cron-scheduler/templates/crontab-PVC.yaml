{{- if .Values.enabled }}
{{- if .Values.global.pvc.createPVC }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crontab-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10M
  {{- if .Values.global.pvc.storageClassName }}
  storageClassName: {{ .Values.global.pvc.storageClassName }}
  {{- end }}
{{- end }}
{{- end }}
