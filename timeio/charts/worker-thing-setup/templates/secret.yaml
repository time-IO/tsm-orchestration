{{- if .Values.enabled }}
{{- if .Values.global.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-secret
type: Opaque
stringData:
  MQTT_USER: "{{ .Values.global.secrets.MQTT_USER }}"
  MQTT_PASSWORD: "{{ .Values.global.secrets.MQTT_PASSWORD }}"
  DATABASE_URL: "postgresql://{{ .Values.global.secrets.CREATEDB_POSTGRES_USER }}:{{ .Values.global.secrets.CREATEDB_POSTGRES_PASSWORD }}@{{ .Values.global.envvars.CREATEDB_POSTGRES_HOST }}/{{ .Values.global.envvars.CREATEDB_POSTGRES_DATABASE }}"
  MINIO_ACCESS_KEY: "{{ .Values.global.secrets.MINIO_ROOT_USER }}"
  MINIO_SECURE_KEY: "{{ .Values.global.secrets.MINIO_ROOT_PASSWORD }}"
  GRAFANA_USER: "{{ .Values.global.secrets.VISUALIZATION_USER }}"
  GRAFANA_PASSWORD: "{{ .Values.global.secrets.VISUALIZATION_PASSWORD }}"
  DB_API_AUTH_TOKEN: "{{ .Values.global.secrets.DB_API_AUTH_TOKEN_ADMIN }}"
  FERNET_ENCRYPTION_SECRET: {{ .Values.global.secrets.FERNET_ENCRYPTION_SECRET | quote }}
  CONFIGDB_DSN: "postgresql://{{-  .Values.global.secrets.CONFIGDB_POSTGRES_USER -}}:{{-  .Values.global.secrets.CONFIGDB_POSTGRES_PASSWORD -}}@{{-  .Values.global.envvars.CONFIGDB_POSTGRES_HOST -}}/{{-  .Values.global.envvars.CONFIGDB_POSTGRES_DATABASE -}}"
{{- end }}
{{- end }}