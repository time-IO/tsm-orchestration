apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-html
data:
  index.html: |
    <!DOCTYPE html>
    <html>
        <head>
            <title>time.IO</title>
            <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0">
            <link rel="stylesheet" href="./css/style.css">
        </head>
        <body>
            <div id="section-container">
                <div id="section-images">
                    <a href="{{ .Values.ref.institute.link }}">
                        <img class="img-head" alt="{{ .Values.ref.institute.name }}" src="data:image/png;base64,{{ .Files.Get "conf/institute.png" | b64enc }}" />
                    </a>
                    <a href="{{ .Values.ref.department.link }}">
                        <img class="img-head" alt="{{ .Values.ref.department.name }}" src="data:image/png;base64,{{ .Files.Get "conf/department.png" | b64enc }}" />
                    </a>
                </div>
                <div id="section-title">
                    <a href="https://codebase.helmholtz.cloud/ufz-tsm" target="_blank">
                        <h1 id="title">time.IO</h1>
                        <h2 id="subtitle">Time Series Management</h2>
                    </a>
                </div>
                <div id="section-links">
                    <ul id="link-card-list">
                        <li class="link-card-wrapper" style="animation-duration: .4s;">
                            <a href="frontend/tsm">
                                <div class="link-card">
                                    <div class="link-card-header">frontend</div>
                                    <div class="link-card-text">User Interface</div>
                                    <div class="link-card-arrow">&nearr;</div>
                                </div>
                            </a>
                        </li>
                        <li class="link-card-wrapper" style="animation-duration: .6s;">
                            <a href="object-storage/login">
                                <div class="link-card">
                                    <div class="link-card-header">minio</div>
                                    <div class="link-card-text">Object storage</div>
                                    <div class="link-card-arrow">&nearr;</div>
                                </div>
                            </a>
                        </li>
                        <li class="link-card-wrapper" style="animation-duration: .8s;">
                            <a href="visualization/">
                                <div class="link-card">
                                    <div class="link-card-header">grafana</div>
                                    <div class="link-card-text">Data visualization</div>
                                    <div class="link-card-arrow">&nearr;</div>
                                </div>
                            </a>
                        </li>
                        <li class="link-card-wrapper" style="animation-duration: 1s;">
                            <a href="sta/">
                                <div class="link-card">
                                    <div class="link-card-header">sta</div>
                                    <div class="link-card-text">Sensor Things API</div>
                                    <div class="link-card-arrow">&nearr;</div>
                                </div>
                            </a>
                        </li>
                        <li class="link-card-wrapper" style="animation-duration: 1s;">
                            <a href="keycloak/">
                                <div class="link-card">
                                    <div class="link-card-header">keycloak</div>
                                    <div class="link-card-text">User Management</div>
                                    <div class="link-card-arrow">&nearr;</div>
                                </div>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </body>
        </html>