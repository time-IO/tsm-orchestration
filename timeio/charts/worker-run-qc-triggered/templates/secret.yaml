{{- if .Values.enabled }}
{{- if .Values.global.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-secret
type: Opaque
stringData:
  MQTT_USER: {{ .Values.global.secrets.MQTT_USER | quote }}
  MQTT_PASSWORD: {{ .Values.global.secrets.MQTT_PASSWORD | quote }}
  DATABASE_DSN: "postgresql://{{ .Values.global.secrets.CREATEDB_POSTGRES_USER }}:{{ .Values.global.secrets.CREATEDB_POSTGRES_PASSWORD }}@{{ .Values.global.envvars.CREATEDB_POSTGRES_HOST }}/{{ .Values.global.envvars.CREATEDB_POSTGRES_DATABASE }}"
  DB_API_AUTH_TOKEN: {{ .Values.global.secrets.DB_API_AUTH_TOKEN_PROCESSING | quote }}
{{- end }}
{{- end }}