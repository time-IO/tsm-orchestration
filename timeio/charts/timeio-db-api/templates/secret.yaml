{{- if .Values.existingSecret | empty }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-secret
type: Opaque
stringData:
  DB_URL: "postgresql://{{-  .Values.global.secrets.POSTGRES_USER -}}:{{-  .Values.global.secrets.POSTGRES_PASSWORD -}}@{{-  .Values.global.envvars.CREATEDB_POSTGRES_HOST -}}/{{-  .Values.global.envvars.CREATEDB_POSTGRES_DATABASE -}}"
{{- end }}