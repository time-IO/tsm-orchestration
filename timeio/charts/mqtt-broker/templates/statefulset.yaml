apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  serviceName: {{ .Values.name }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      containers:
      - name: {{ .Values.name }}
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
          capabilities:
            drop: {{ .Values.securityContext.capabilities.drop }}
          runAsUser: {{ .Values.securityContext.runAsUser }}
          runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
          seccompProfile:
            type: {{ .Values.securityContext.seccompProfile.type }}
        command: ["/bin/sh", "/entrypoint/docker-entrypoint.sh", "/usr/sbin/mosquitto", "-c", "/tmp/mosquitto-conf/mosquitto.conf"]
        envFrom:
        - configMapRef:
            name: {{ .Values.name }}-envvars
        - secretRef:
            name: {{ if .Values.global.createSecrets }}
                     {{ printf "%s-secret" .Values.name }}
                   {{ else }}
                     {{ .Values.existingSecret }}
                   {{ end }}
        volumeMounts:
        - mountPath: /mosquitto-data
          name: {{ .Values.name }}-pv
        - mountPath: /entrypoint
          name: {{ .Values.name }}-entrypoint
        - mountPath: /etc/mosquitto/config
          name: {{ .Values.name }}-config
        - mountPath: /etc/mosquitto/config/tls
          name: {{ .Values.name }}-tls-config
      volumes:
      - name: {{ .Values.name }}-pv
        persistentVolumeClaim:
          claimName: {{ .Values.name }}-pvc
      - name: {{ .Values.name }}-entrypoint
        configMap:
          name: {{ .Values.name }}-entrypoint
      - name: {{ .Values.name }}-config
        configMap:
          name: {{ .Values.name }}-config
      - name: {{ .Values.name }}-tls-config
        configMap:
          name: {{ .Values.name }}-tls-config