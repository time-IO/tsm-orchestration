apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-envvars
data:
  LOG_LEVEL: "{{  .Values.global.envvars.LOG_LEVEL }}"
  TOPIC: "object_storage_notification"
  MQTT_BROKER: "mqtt-broker:1883"
  MQTT_CLIENT_ID: ""
  MQTT_CLEAN_SESSION: "{{  .Values.global.envvars.MQTT_CLEAN_SESSION }}"
  MQTT_QOS: "{{  .Values.global.envvars.MQTT_QOS }}"
  MINIO_SECURE: "{{  .Values.global.envvars.MINIO_SECURE }}"
  MINIO_URL: "{{  .Values.global.envvars.MINIO_HOST }}"
  SCHEDULER: "{{  .Values.global.envvars.SCHEDULER }}"
  SCHED_HOST: "{{  .Values.global.envvars.SCHED_HOST }}"
  SCHED_MQTT_BROKER: "mqtt-broker:1883"
  SCHED_JOB_LOG_LEVEL: "{{  .Values.global.envvars.SCHED_JOB_LOG_LEVEL }}"
  SCHED_SLURM_RESTAPI_VERSION: "{{  .Values.global.envvars.SCHED_SLURM_RESTAPI_VERSION }}"