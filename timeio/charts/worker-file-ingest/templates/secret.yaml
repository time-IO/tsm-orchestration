{{- if .Values.enabled }}
{{- if .Values.global.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-secret
type: Opaque
stringData:
  MQTT_USER: "{{ .Values.global.secrets.MQTT_USER }}"
  MQTT_PASSWORD: "{{ .Values.global.secrets.MQTT_PASSWORD }}"
  MINIO_ACCESS_KEY: "{{ .Values.global.secrets.MINIO_ROOT_USER }}"
  MINIO_SECURE_KEY: "{{ .Values.global.secrets.MINIO_ROOT_PASSWORD }}"
  DB_API_AUTH_TOKEN: {{ .Values.global.secrets.DB_API_AUTH_TOKEN_INGEST | quote }}
  DSMDB_DSN: "postgresql://{{-  .Values.global.secrets.DSM_API_DATABASE_USER -}}:{{-  .Values.global.secrets.DSM_API_DATABASE_PASS -}}@{{-  .Values.global.envvars.CREATEDB_POSTGRES_HOST -}}:5432/{{-  .Values.global.envvars.CREATEDB_POSTGRES_DATABASE -}}"
{{- end }}
{{- end }}
