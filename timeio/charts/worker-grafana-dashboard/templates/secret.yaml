{{- if .Values.global.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-secret
type: Opaque
stringData:
  MQTT_USER: "{{  .Values.global.secrets.MQTT_USER }}"
  MQTT_PASSWORD: "{{  .Values.global.secrets.MQTT_PASSWORD }}"
  GRAFANA_USER: "{{  .Values.global.secrets.GRAFANA_USER }}"
  GRAFANA_PASSWORD: "{{  .Values.global.secrets.GRAFANA_PASSWORD }}"
  FERNET_ENCRYPTION_SECRET: {{ .Values.global.secrets.FERNET_ENCRYPTION_SECRET | quote }}
  CONFIGDB_DSN: "postgresql://{{-  .Values.global.secrets.CONFIGDB_POSTGRES_USER -}}:{{-  .Values.global.secrets.CONFIGDB_POSTGRES_PASSWORD -}}@{{-  .Values.global.envvars.CONFIGDB_POSTGRES_HOST -}}/{{-  .Values.global.envvars.CONFIGDB_POSTGRES_DATABASE -}}"
{{- end }}