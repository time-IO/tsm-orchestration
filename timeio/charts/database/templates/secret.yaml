{{- if .Values.global.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-secret
type: Opaque
stringData:
  POSTGRES_USER: "{{  .Values.global.secrets.CREATEDB_POSTGRES_USER }}"
  POSTGRES_PASSWORD: "{{  .Values.global.secrets.CREATEDB_POSTGRES_PASSWORD }}"
  CREATEDB_POSTGRES_USER: "{{  .Values.global.secrets.CREATEDB_POSTGRES_USER }}"
  CREATEDB_POSTGRES_PASSWORD: "{{  .Values.global.secrets.CREATEDB_POSTGRES_PASSWORD }}"
{{- end }}