apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-deployment
  labels:
    app: {{ .Values.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      containers:
        - name: {{ .Values.name }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python3
            - main.py
            - parse-mqtt-data
            - --target-uri
            - "postgresql://{{ .Values.envvars.CREATEDB_POSTGRES_USER}}:{{ .Values.envvars.CREATEDB_POSTGRES_PASSWORD}}@{{ .Values.envvars.CREATEDB_POSTGRES_HOST}}/{{ .Values.envvars.CREATEDB_POSTGRES_DATABASE}}"
          envFrom:
            - secretRef:
                name: {{ .Values.name }}-secret