apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-secret
type: Opaque
stringData:
  LOG_LEVEL: "{{ .Values.envvars.LOG_LEVEL }}"
  TOPIC: "data_parsed"
  MQTT_BROKER: "mqtt-broker:1883"
  MQTT_USER: "{{ .Values.envvars.MQTT_USER }}"
  MQTT_PASSWORD: "{{ .Values.envvars.MQTT_PASSWORD }}"
  MQTT_CLIENT_ID: ""
  MQTT_CLEAN_SESSION: "{{ .Values.envvars.MQTT_CLEAN_SESSION }}"
  MQTT_QOS: "{{ .Values.envvars.MQTT_QOS }}"
  SCHEDULER: "{{ .Values.envvars.SCHEDULER }}"
  SCHED_HOST: "{{ .Values.envvars.SCHED_HOST }}"
  SCHED_MQTT_BROKER: "{{ .Values.envvars.MQTT_BROKER }}"
  SCHED_MQTT_USER: "{{ .Values.envvars.MQTT_USER }}"
  SCHED_MQTT_PASSWORD: "{{ .Values.envvars.MQTT_PASSWORD }}"
  SCHED_JOB_LOG_LEVEL: "{{ .Values.envvars.SCHED_JOB_LOG_LEVEL }}"
  SCHED_SLURM_RESTAPI_VERSION: "{{ .Values.envvars.SCHED_SLURM_RESTAPI_VERSION }}"
  SCHED_SLURM_USER: "{{ .Values.envvars.SCHED_SLURM_USER }}"
  SCHED_SLURM_JWT_TOKEN: "{{ .Values.envvars.SCHED_SLURM_JWT_TOKEN }}"