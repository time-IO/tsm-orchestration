apiVersion: v2
name: timeio
description: "A Helm chart for time.IO"
type: application
version: 0.1.12

icon: https://tsm.ufz.de/images/timeio.svg

dependencies:

  - name: cron-scheduler
    version: 0.0.1
    repository: "file://charts/cron-scheduler"

  - name: flyway
    version: 0.0.1
    repository: "file://charts/flyway"

  - name: frost
    version: 0.0.1
    repository: "file://charts/frost"

  - name: mosquitto
    version: 0.0.1
    repository: "file://charts/mosquitto"

  - name: object-storage
    version: 0.0.1
    repository: "file://charts/object-storage"

  - name: proxy
    version: 0.0.1
    repository: "file://charts/proxy"

  - name: timeio-db-api
    version: 0.0.1
    repository: "file://charts/timeio-db-api"

  - name: tsmdl
    version: 0.0.1
    repository: "file://charts/tsmdl"

  - name: visualization
    version: 0.0.1
    repository: "file://charts/visualization"

  - name: worker-configdb-updater
    version: 0.0.1
    repository: "file://charts/worker-configdb-updater"

  - name: worker-db-setup
    version: 0.0.1
    repository: "file://charts/worker-db-setup"

  - name: worker-file-ingest
    version: 0.0.1
    repository: "file://charts/worker-file-ingest"

  - name: worker-grafana-dashboard
    version: 0.0.1
    repository: "file://charts/worker-grafana-dashboard"

  - name: worker-grafana-user-orgs
    version: 0.0.1
    repository: "file://charts/worker-grafana-user-orgs"

  - name: worker-mqtt-ingest
    version: 0.0.1
    repository: "file://charts/worker-mqtt-ingest"

  - name: worker-mqtt-user-creation
    version: 0.0.1
    repository: "file://charts/worker-mqtt-user-creation"

  - name: worker-object-storage-setup
    version: 0.0.1
    repository: "file://charts/worker-object-storage-setup"

  - name: worker-run-qaqc
    version: 0.0.1
    repository: "file://charts/worker-run-qaqc"

  - name: worker-sync-extapis
    version: 0.0.1
    repository: "file://charts/worker-sync-extapis"

  - name: worker-sync-extsftp
    version: 0.0.1
    repository: "file://charts/worker-sync-extsftp"

  - name: worker-sync-sms
    version: 0.0.1
    repository: "file://charts/worker-sync-sms"

  - name: postgresql
    version: "16.6.*"
    repository: "https://charts.bitnami.com/bitnami"
    condition: database.enabled
    alias: "database"

