# local PostgreSQL chart using postgis/postgis image
database:
  # ToDo: disable when using external postgres database
  enabled: true
  image:
    repository: postgis/postgis
    tag: "17-3.5"
  fullnameOverride: "database"
  auth:
    username: "postgres"
    # ToDo: Change password and use secret instead of hardcoding it here
    password: "ChangeMe!"
    database: "postgres"
  persistence:
    enabled: true
    storageClass: "tanzu-storage-policy-raid5-ftt1"
    # ToDo: Adjust according to needs
    size: 1Gi
  persistentVolumeClaimRetentionPolicy:
    # ToDo: Adjust according to needs
    enabled: true
    whenDeleted: "Delete"
  containerSecurityContext:
    seccompProfile:
      type: "RuntimeDefault"

global:

  pvc:
    storageClassName: "tanzu-storage-policy-raid5-ftt1"
    createPVC: true

  ingress:
    enabled: true
    enableTLS: true
    className: haproxy
    annotations:
      cert-manager.io/cluster-issuer: "cert-manager-acme"
      cert-manager.io/private-key-algorithm: "ECDSA"
      cert-manager.io/private-key-size: "384"
      cert-manager.io/private-key-rotation-policy: "Always"
      external-dns.alpha.kubernetes.io/hostname: "timeio.web-intern-stage.app.ufz.de"
      haproxy-ingress.github.io/config-backend: |
        http-response set-header 'X-Content-Type-Options' 'nosniff';
        http-response set-header 'Content-Security-Policy' "default-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src 'self' *.web-intern-stage.app.ufz.de; child-src 'self' *.web-intern-stage.app.ufz.de; object-src 'none'; frame-ancestors 'self' http://*.web-intern-stage.app.ufz.de https://*.web-intern-stage.app.ufz.de;";
        http-response set-header 'X-XSS-Protection' '1';
    hosts:
    - host: "timeio.web-intern-stage.app.ufz.de"
      paths:
      - path: "/"
        pathType: Prefix
        serviceName: "proxy"
        servicePort: 80
    url: "https://timeio.web-intern-stage.app.ufz.de"
    tls:
    - secretName: "timeio-ingress-tls"
      hosts:
        - "timeio.web-intern-stage.app.ufz.de"

  # ToDo: Adjust according to needs
  s3ingress:
    enabled: false
    enableTLS: true
    className: haproxy
    annotations:
      nginx.ingress.kubernetes.io/force-ssl-redirect: 'false'
      nginx.ingress.kubernetes.io/rewrite-target: '/'
      nginx.ingress.kubernetes.io/backend-protocol: http
      cert-manager.io/cluster-issuer: "cert-manager-acme"
      cert-manager.io/private-key-algorithm: "ECDSA"
      cert-manager.io/private-key-size: "384"
      cert-manager.io/private-key-rotation-policy: "Always"
      nginx.ingress.kubernetes.io/configuration-snippet: |
        add_header 'X-Content-Type-Options' 'nosniff' always;
        add_header 'Content-Security-Policy' "default-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' ; frame-src 'self' *.ufz.de ; child-src 'self' *.ufz.de ; object-src 'none' ; frame-ancestors 'self' http://*.ufz.de https://*.ufz.de ;" always;
        add_header 'X-XSS-Protection' '1';
    hosts:
    - host: "s3.web-intern-stage.app.ufz.de"
      paths:
      - path: "/"
        pathType: Prefix
        serviceName: "proxy"
        servicePort: 9000
    url: "https://s3.web-intern-stage.app.ufz.de"
    tls:
    - secretName: "timeio-s3-ingress-tls"
      hosts:
        - "s3.web-intern-stage.app.ufz.de"

  createSecrets: false

  createConfigMaps: true

  envvars:
    LOG_LEVEL: "DEBUG"
    PROXY_HOST: "timeio.web-intern-stage.app.ufz.de"
    OIDC_ISSUER: "https://timeio.web-intern-stage.app.ufz.de/keycloak/realms/timeio"
    OIDC_CONF_URL: "https://timeio.web-intern-stage.app.ufz.de/keycloak/realms/timeio/.well-known/openid-configuration"
    OIDC_AUTH_URL: "https://timeio.web-intern-stage.app.ufz.de/keycloak/realms/timeio/protocol/openid-connect/auth"
    OIDC_TOKEN_URL: "https://timeio.web-intern-stage.app.ufz.de/keycloak/realms/timeio/protocol/openid-connect/token"
    OIDC_API_URL: "https://timeio.web-intern-stage.app.ufz.de/keycloak/realms/timeio/protocol/openid-connect/userinfo"
    ALLOWED_VOS: "VO,UFZ-TSM"
    KC_LOG_LEVEL: "DEBUG"
    KEYCLOAK_THING_MANAGEMENT_CLIENT_BASE_URL: "https://login-dev.helmholtz.de"
    KEYCLOAK_GENERIC_OIDC_ISSUER: "https://login-dev.helmholtz.de/oauth2"
    KEYCLOAK_GENERIC_OIDC_AUTH_URL: "https://login-dev.helmholtz.de/oauth2-as/oauth2-authz"
    KEYCLOAK_GENERIC_OIDC_TOKEN_URL: "https://login-dev.helmholtz.de/oauth2/token"
    KEYCLOAK_GENERIC_OIDC_USERINFO_URL: "https://login-dev.helmholtz.de/oauth2/userinfo"
    KEYCLOAK_GENERIC_OIDC_JWKS_URL: "https://login-dev.helmholtz.de/oauth2/jwk"
    KEYCLOAK_GENERIC_OIDC_CONF_URL: "https://login-dev.helmholtz.de/oauth2/.well-known/openid-configuration"


